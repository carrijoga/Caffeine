name: Release

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  release:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Bump version
        id: bump
        shell: pwsh
        run: |
          $output = pwsh build/bump-version.ps1
          $output | ForEach-Object { Write-Host $_ }
          $newVersion = ($output | Select-String -Pattern '^NEW_VERSION=(.+)$').Matches[0].Groups[1].Value
          "version=$newVersion" >> $env:GITHUB_OUTPUT

      - name: Commit version bump
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/Caffeine.App/Package.appxmanifest
          git commit -m "chore: bump version to ${{ steps.bump.outputs.version }} [skip ci]"
          git tag "v${{ steps.bump.outputs.version }}"
          git push origin HEAD:master
          if ($LASTEXITCODE -ne 0) { throw "git push to master failed." }
          git push origin "v${{ steps.bump.outputs.version }}"
          if ($LASTEXITCODE -ne 0) { throw "git push of tag failed." }

      - name: Build MSIX
        shell: pwsh
        run: |
          dotnet build src/Caffeine.App/Caffeine.App.csproj `
            -c Release -p:Platform=x64 -p:GenerateAppxPackageOnBuild=true

      - name: Decode signing certificate
        shell: pwsh
        run: |
          $bytes = [Convert]::FromBase64String("${{ secrets.MSIX_SIGNING_CERT }}")
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\CaffeineDev.pfx", $bytes)

      - name: Sign MSIX
        shell: pwsh
        run: |
          $msix = Get-ChildItem "src/Caffeine.App/AppPackages" -Recurse -Filter "*.msix" |
              Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $msix) { throw "No .msix produced." }

          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
              Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { throw "signtool.exe not found." }

          & $signtool.FullName sign /fd SHA256 /a /f "$env:RUNNER_TEMP\CaffeineDev.pfx" /p "${{ secrets.MSIX_SIGNING_PASSWORD }}" $msix.FullName
          if ($LASTEXITCODE -ne 0) { throw "Signing failed." }

          Write-Host "MSIX_PATH=$($msix.FullName)"
          "msix_path=$($msix.FullName)" >> $env:GITHUB_OUTPUT
        id: sign

      - name: Clean up signing certificate
        if: always()
        shell: pwsh
        run: Remove-Item "$env:RUNNER_TEMP\CaffeineDev.pfx" -ErrorAction SilentlyContinue

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ steps.bump.outputs.version }}"
          name: "v${{ steps.bump.outputs.version }}"
          generate_release_notes: true
          files: |
            ${{ steps.sign.outputs.msix_path }}
            build/CaffeineDev.cer
